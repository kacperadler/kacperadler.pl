# Cache-Control resolved by URI pattern - kept in a map so the server
# block uses a single add_header line. Putting Cache-Control inside
# location blocks would silently drop the security headers below
# because nginx's add_header doesn't inherit across levels.
map $uri $cache_control {
    ~^/api/                                 "no-store";
    ~^/_astro/                              "public, max-age=31536000, immutable";
    ~*\.(woff2?|ttf|otf|eot)$               "public, max-age=31536000, immutable";
    ~*\.(png|jpg|jpeg|gif|webp|avif|svg|ico)$ "public, max-age=2592000";
    default                                 "public, max-age=0, must-revalidate";
}

# Pagination jump (pagination.astro, `jump`): its GET form sends
# <list>/?strona=<n>, but a prerendered page never reads its query, and
# Astro's paginate() puts page n at <list>/<n>/ and page 1 at <list>/.
# This turns the query into that path for the paginated lists only
# (/blog/, /realizacje/, and /lista/, the e2e build's fixture), from the
# list or one of its numbered pages; any other URI maps to "" (no
# redirect), so /?strona=3 serves the home page as before.
map "$uri?$arg_strona" $pagination_jump {
    ~^(?<jump_list>/(?:blog|realizacje|lista)/)(?:[0-9]+/)?\?0*1$                         $jump_list;
    ~^(?<jump_list>/(?:blog|realizacje|lista)/)(?:[0-9]+/)?\?0*(?<jump_page>[1-9][0-9]*)$ $jump_list$jump_page/;
    default                                                                              "";
}

# /api/lead takes 5 posts a minute per client IP, all 5 at once if they come
# together (the first plus a burst of 4), the 6th gets 429: a visitor sending
# the form never meets it, a script that loops
# gets 429 (the form shows it as its send error) instead of filling the
# lead store and the Resend quota. The key is the client IP that the
# real_ip directives below resolve, never Traefik's own address.
limit_req_zone $binary_remote_addr zone=lead:1m rate=5r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /app/dist/client;
    index index.html;

    # Astro generates real .html files; no SPA fallback. Hashed assets
    # in /_astro/ are immutable. /404.html is the static fallback. Only
    # /api/ (the lead store, src/pages/api/lead.ts) goes to the Node
    # server that docker-start.sh runs next to nginx.

    server_tokens off;

    # Redirects carry a path, not http://<host>/...: TLS ends at Traefik,
    # so an absolute Location would send visitors back to plain http.
    absolute_redirect off;

    # See the map above: ?strona=<n> lands on the path page.
    if ($pagination_jump) {
        return 302 $pagination_jump;
    }

    # The client IP: Traefik reaches the container over Dokploy's overlay
    # network (dokploy-network, in Docker Swarm's default 10.0.0.0/8 pool)
    # and puts the address it saw last in X-Forwarded-For. Only a request
    # from that network may name its client; from anywhere else the header
    # is ignored, so a script cannot claim a fresh IP per post. Recursion
    # stays off: the last address is the one Traefik wrote, not one the
    # client sent.
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    # Compression (text only - alpine nginx ships gzip; brotli would
    # need a custom build).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    # Single set of headers so add_header inheritance can't drop them.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Astro emits dir-style routes (/foo/index.html). Try the URI as a
    # file, then as a dir (auto-index), then with .html suffix - covers
    # /, /foo/, and edge cases.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The Node server's own Cache-Control is hidden so the response
    # carries the map's one. Its 4xx/5xx JSON passes through untouched
    # (proxy_intercept_errors stays off), so the form sees the real answer.
    # Past the lead zone's rate and burst nginx answers 429 itself.
    location /api/ {
        limit_req zone=lead burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
    }

    # Astro emits dist/client/404.html; nginx returns it for any unresolved URI.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
