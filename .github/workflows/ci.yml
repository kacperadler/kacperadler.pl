name: CI

on:
  push:
    # arthur/** are the branches Arthur's jobs push: CI on them lets a
    # reviewed ticket merge on its own once its branch is green.
    branches: [main, "arthur/**"]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lint, check, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Astro CLI (astro check, astro build) shells out to Node - bun
      # alone isn't enough. Astro 7 requires Node >= 22.12.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Reads packageManager: "bun@x.y.z" from package.json
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ultracite check = biome check: lint and format, .astro included.
      - name: Lint + format check (ultracite/Biome)
        run: bun run lint

      - name: Type-check (.astro)
        run: bun run check

      - name: Build
        run: bun run build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cache the browser binaries between runs - keyed on the
      # @playwright/test version so an upgrade busts the cache.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun pm ls @playwright/test | awk '/@playwright\/test/ {print $NF; exit}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # The browser alone, no --with-deps and no install-deps: those run apt
      # against Ubuntu's package servers, which the runner failed to resolve
      # in every run from 2026-11-11 (KA0171). ubuntu-latest carries Google
      # Chrome, whose packages bring the libraries Chromium needs; the next
      # step checks that on every run.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      # Playwright looks for missing libraries in a folder its Chromium no
      # longer has (chrome-linux, not chrome-linux64), so a library the image
      # drops would only show as a crash in every spec. ldd names it here.
      - name: Check Chromium's system libraries
        run: |
          missing=$(find ~/.cache/ms-playwright/chromium* -type f \( -perm -u+x -o -name '*.so*' \) -exec ldd {} + 2>/dev/null | awk '$2 == "=>" && $3 == "not" { print $1 }' | sort -u)
          if [ -n "$missing" ]; then
            echo "::error title=Chromium lacks system libraries::the runner image has no" $missing "- this job installs no apt packages (KA0171): add the packages that ship them before this step"
            exit 1
          fi
          echo "Every library Chromium links is on the runner."

      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
